name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test · typecheck · lint · build
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Next.js app + all tooling live in this subdirectory.
        working-directory: spec-compiler-mvp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spec-compiler-mvp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit + integration tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
